plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            // The single-project build ran in the repo-root `run/`, which still
            // holds the dev instance's steady_sight-client.toml, its
            // vanilla-settings marker and a test world. Keeping the run here
            // means every launch re-checks that an existing install's state is
            // still read, not regenerated.
            gameDirectory = rootProject.file('run')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}
