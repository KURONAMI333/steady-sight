# Steady Sight — client-side comfort options for motion sickness.
# Multiloader: common / neoforge / fabric, Minecraft 1.21.1.
#
# Every field the metadata templates reference must also appear in the
# expandProps map in buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=0.3.0
group=com.kuronami.steadysight
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Steady Sight
mod_author=KURONAMI
mod_id=steady_sight
license=All Rights Reserved
credits=
description=Steady Sight bundles comfort settings for players who get motion sick: an always-on vignette, smoother camera over one-block steps and minecart slopes, the vanilla accessibility settings applied automatically, and screen-shake settings in other installed mods capped. Client-side only.
# Deliberately the exact-version range v0.2.0 shipped with, not a [1.21.1, 1.22)
# span: widening it would change which game versions the published NeoForge jar
# accepts, which is a release decision and not part of the multiloader split.
minecraft_version_range=[1.21.1]
## The version of Minecraft the 'common' project compiles against, see
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# Fabric
fabric_version=0.109.0+1.21.1
fabric_loader_version=0.16.9

# NeoForge
neoforge_version=21.1.227
# v0.2.0 shipped loaderVersion="[1,)"; kept verbatim so an existing install's
# loader check behaves identically.
neoforge_loader_version_range=[1,)

# night-config: NeoForge already ships these (its own ModConfigSpec machinery
# depends on them), Fabric does not — the fabric cell jar-in-jars them at the
# exact versions NeoForge 21.1.227 bundles, so io.OtherModConfigFile behaves
# the same on both loaders.
night_config_version=3.8.3

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
