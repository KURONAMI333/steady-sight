# Steady Sight — client-side comfort options for motion sickness.
# Multiloader: common / neoforge / fabric, Minecraft 26.1.2.
#
# This cell is an independent Gradle build (its own wrapper, settings.gradle and
# buildSrc); the repo root's settings.gradle does not include it. The 1.21.1
# cell lives at the repo root, ml-1.21.11/ and ml-26.2/ hold the other two
# waves, and none of the three is touched by this one.
#
# Every field the metadata templates reference must also appear in the
# expandProps map in buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=0.2.0
group=com.kuronami.steadysight
# 26.x is Java 25 (toolchain, mixin compatibilityLevel and the class file
# version in the shipped jar must all agree: 25 -> major 69).
java_version=25

# Common
minecraft_version=26.1.2
mod_name=Steady Sight
mod_author=KURONAMI
mod_id=steady_sight
license=All Rights Reserved
credits=
description=Steady Sight bundles comfort settings for players who get motion sick: an always-on vignette, smoother camera over one-block steps and minecart slopes, the vanilla accessibility settings applied automatically, and screen-shake settings in other installed mods capped. Client-side only.
# Not the newest cell (26.2 is): the upper bound is closed at the next cell's
# floor so a NeoForge install cannot satisfy both this jar and the 26.2 jar
# at once.
minecraft_version_range=[26.1.2,26.2)
## The version of Minecraft the 'common' project compiles against, see
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.1.2-1
# No Parchment: 26.1+ ships Mojang's official parameter names with the
# deobfuscated sources, so the parchment blocks and their two properties are
# gone from this cell entirely (26.2_MIGRATION_NOTES.md §1 — the same is true
# one minor earlier, at 26.1.2).

# Fabric
fabric_version=0.155.2+26.1.2
fabric_loader_version=0.19.3

# NeoForge
neoforge_version=26.1.2.92
# Closed at the next cell's floor, not left open on the patch number: matches
# mod-062-welcome-board/neoforge-26.1.2's precedent ("パッチまで切らずマイナー
# で止める") and this Wave's own instructions. Not a beta build (confirmed
# against the gradle module cache: no "-beta" suffix, unlike 26.1.2.36-beta
# and 26.2.0.28-beta) so, unlike the 26.2 cell, cutting on the minor cannot
# reject an earlier same-minor build — but the upper bound still needs to
# close here, the same reason minecraft_version_range does.
neoforge_version_range=[26.1.2,26.2)
neoforge_loader_version_range=[1,)

# night-config: NeoForge already ships these (its own ModConfigSpec machinery
# depends on them), Fabric does not — the fabric cell jar-in-jars them at the
# exact versions NeoForge 26.1.2.92 bundles, so io.OtherModConfigFile behaves
# the same on both loaders. Re-derived from the 26.1.2.92 neoforge module
# metadata (net.neoforged:neoforge:26.1.2.92's .module file: both
# com.electronwill.night-config:core and :toml require 3.8.3) rather than
# copied from the 26.2 cell — it happens to be the same value there too.
night_config_version=3.8.3

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
