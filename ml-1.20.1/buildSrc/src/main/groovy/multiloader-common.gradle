plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

// No withSourcesJar()/withJavadocJar(): the single-source repo this replaced
// published neither, the mod is All Rights Reserved (a sources jar sitting in
// build/libs is a publishing hazard for the release wave), and javadoc as a
// `build` gate fails on doc links that point at the test source set — which is
// a documentation nit, not a reason to block a release build. The 1.20.1
// template (mod-048) does enable both; that difference is deliberate.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
}

// Declare capabilities on the outgoing configurations so a loader project can
// depend on ':common' without dragging in the other loaders' variants.
['apiElements', 'runtimeElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

// PORTING_CHECKLIST §13: `from()` silently no-ops when the file is missing, so
// the LICENSE is declared as a task input too — an absent LICENSE fails the
// build instead of shipping a jar without it. This cell is its own Gradle
// build, so `rootProject` is `ml-1.20.1/`, not the repo root — the one LICENSE
// lives a directory up.
def licenseFile = rootProject.file('../LICENSE')

jar {
    inputs.file(licenseFile)
    from(licenseFile) {
        rename { "LICENSE_${mod_id}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                   : version,
            'group'                     : project.group,
            'minecraft_version'         : minecraft_version,
            'minecraft_version_range'   : minecraft_version_range,
            'fabric_version'            : fabric_version,
            'fabric_loader_version'     : fabric_loader_version,
            'mod_name'                  : mod_name,
            'mod_author'                : mod_author,
            'mod_id'                    : mod_id,
            'license'                   : license,
            'description'               : project.description,
            'forge_version'             : forge_version,
            'forge_loader_version_range': forge_loader_version_range,
            'credits'                   : credits,
            'java_version'              : java_version
    ]

    // Forge 1.20.1 reads META-INF/mods.toml, not neoforge.mods.toml.
    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', '*.mixins.json']) {
        expand expandProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${rootProject.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
