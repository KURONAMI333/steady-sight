# Steady Sight — client-side comfort options for motion sickness.
# Multiloader cell for Minecraft 1.20.1: common / forge / fabric.
#
# NeoForge does not exist on 1.20.1, so this is the one cell whose "the other
# loader" is Forge. Java is 17 here, not 21/25 like every other cell.
#
# Every field the metadata templates reference must also appear in the
# expandProps map in buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=0.3.0
group=com.kuronami.steadysight
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Steady Sight
mod_author=KURONAMI
mod_id=steady_sight
license=All Rights Reserved
credits=
description=Steady Sight bundles comfort settings for players who get motion sick: an always-on vignette, smoother camera over one-block steps and minecart slopes, the vanilla accessibility settings applied automatically, and screen-shake settings in other installed mods capped. Client-side only.
# 1.20.1 is an island: the next cell up is 1.21.1, so nothing above this
# version is in range and the exact-version form says so.
minecraft_version_range=[1.20.1]
# https://parchmentmc.org/docs/getting-started#choose-a-version
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# Forge
forge_version=47.2.30
# Forge 47's own loader range, matching mod-048's 1.20.1 cell. The 1.21.1 cell
# ships "[1,)" because that is what v0.2.0 published; there is no published
# 1.20.1 jar to stay compatible with, so this follows the 1.20.1 convention.
forge_loader_version_range=[47,)

# night-config: Forge already ships these (its own ForgeConfigSpec machinery
# depends on them), Fabric does not — the fabric cell jar-in-jars them at the
# exact version Forge 47.2.30 bundles, so io.OtherModConfigFile behaves the
# same on both loaders. Verified against the resolved Forge runtime classpath,
# not assumed (GAP_LOG G102).
night_config_version=3.6.4

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
