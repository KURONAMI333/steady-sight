# Steady Sight — client-side comfort options for motion sickness.
# Multiloader: common / neoforge / fabric, Minecraft 1.21.11.
#
# This cell is an independent Gradle build (its own wrapper, settings.gradle and
# buildSrc); the repo root's settings.gradle does not include it. The 1.21.1
# cell lives at the repo root and the 26.2 cell lives in ml-26.2/; neither is
# touched by this one.
#
# Every field the metadata templates reference must also appear in the
# expandProps map in buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=0.3.0
group=com.kuronami.steadysight
java_version=21

# Common
minecraft_version=1.21.11
mod_name=Steady Sight
mod_author=KURONAMI
mod_id=steady_sight
license=All Rights Reserved
credits=
description=Steady Sight bundles comfort settings for players who get motion sick: an always-on vignette, smoother camera over one-block steps and minecart slopes, the vanilla accessibility settings applied automatically, and screen-shake settings in other installed mods capped. Client-side only.
# Not the newest cell (26.2 is): the upper bound is closed at the next cell's
# floor (26.1.2) so a NeoForge install cannot satisfy both this jar and a
# later 26.x jar at once.
minecraft_version_range=[1.21.11,26.1)
## The version of Minecraft the 'common' project compiles against, see
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050
# No Parchment: matches this project's existing 1.21.11 multiloader mod
# (mod-051-music-disc-maker-12111-ml), which does not use it for this version
# either. 1.21.11 itself is still obfuscated (unlike 26.1+), so Fabric still
# needs officialMojangMappings(); Parchment would only add parameter names on
# top of that, and this cell follows the established precedent of skipping it.

# Fabric
fabric_version=0.141.4+1.21.11
fabric_loader_version=0.19.3

# NeoForge
neoforge_version=21.11.42
# Not a beta build (unlike 26.2's), so the dependency range composes directly
# from neoforge_version in neoforge.mods.toml — no separate range property
# needed here.
neoforge_loader_version_range=[1,)

# night-config: NeoForge already ships these (its own ModConfigSpec machinery
# depends on them), Fabric does not — the fabric cell jar-in-jars them at the
# exact versions NeoForge 21.11.42 bundles (verified against that version's
# userdev config.json), so io.OtherModConfigFile behaves the same on both
# loaders. Same value as the 1.21.1 and 26.2 cells, re-derived rather than
# assumed to stay that way.
night_config_version=3.8.3

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
